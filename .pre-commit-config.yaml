repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0
    hooks:
      - id: numpydoc-validation
        exclude: |
            (?x)(
                .ci/|
                daal4py/|
                examples/|
                generator/|
                scripts/|
                tests/
            )
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--config", ".github/.codespellrc" ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: \.csv$|^doc/third-party-programs
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
        # Jinja-templated
        exclude: ^conda-recipe/meta\.yaml$
  - repo: local
    hooks:
      - id: ascii-only
        name: ASCII-only source
        language: pygrep
        entry: '[^\x00-\x7F]'
        types_or: [python, cython, c, c++, shell, batch, yaml, toml]
        # Deliberately tests a multi-byte separator.
        exclude: ^onedal/common/tests/test_result_options\.py$
